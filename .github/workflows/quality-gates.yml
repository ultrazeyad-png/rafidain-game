name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python tools and scenario tests
        run: python -m py_compile build.py tools/site_split.py tests/*.py

      - name: Build game and validate generated page
        run: python tests/smoke_build.py

      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Verify WebGL context recovery in Chromium
        run: python tests/test_webgl_recovery.py

      - name: Verify combat, region loading, and save/load
        run: python tests/test_gameplay_regression.py
